plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.2.0'
group = 'dev.minehelper'
if (project.hasProperty('minehelperBuildDir')) layout.buildDirectory = file(project.property('minehelperBuildDir'))
base { archivesName = 'minehelper-neoforge-1.21.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.262'
    runs { client { client() } }
    mods { minehelper { sourceSet sourceSets.main } }
}
repositories { mavenCentral() }
dependencies {
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { from('LICENSE') }
